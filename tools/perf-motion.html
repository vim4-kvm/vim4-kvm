<!doctype html><meta charset="utf-8"><title>P0-2 motion source</title>
<style>body{margin:0;background:black}canvas{width:100vw;height:100vh}button{position:absolute;top:40%;left:40%;font-size:32px}</style>
<canvas width="1920" height="1080"></canvas><button>Start motion</button>
<script>
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
document.querySelector('button').onclick=async function(){
  await document.documentElement.requestFullscreen();this.remove();
  async function draw(){
    try {
      const {id}=await (await fetch('/tick',{cache:'no-store'})).json();
      ctx.fillStyle='#124';ctx.fillRect(0,0,1920,1080);
      for(let x=-100;x<1920;x+=100){ctx.fillStyle=`hsl(${(x+id)%360} 80% 60%)`;ctx.fillRect((x+id*7)%2020-100,150,45,800);}
      const word=(0xa5000000|(id<<8)|((id>>8)^(id&255)^0xa5))>>>0;
      for(const y of [85,540,995]){
        ctx.fillStyle='black';ctx.fillRect(0,y-50,1920,100);
        for(let bit=0;bit<32;bit++){ctx.fillStyle=(word>>>(31-bit))&1?'white':'black';ctx.fillRect(20+bit*1880/32,y-40,1880/32,80);}
      }
    } catch(error){document.title=String(error);}
    requestAnimationFrame(draw);
  }
  draw();
};
</script>
